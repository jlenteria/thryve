name: thryve
description: "Intentional progress anchored to your purpose."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management — MVVM with ChangeNotifier view models
  provider: ^6.1.5+1

  # Local persistence
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6                 # Stores picked images as files
  uuid: ^4.4.0                          # Unique goal/action IDs

  # Notifications
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1              # Device timezone for daily reminders

  # Media & formatting
  image_picker: ^1.2.3
  intl: ^0.19.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate platform icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icons/launcher/thryve_launcher.png
  android: true
  adaptive_icon_background: assets/icons/launcher/thryve_launcher_background.png
  adaptive_icon_foreground: assets/icons/launcher/thryve_launcher_foreground.png
  adaptive_icon_monochrome: assets/icons/launcher/thryve_launcher_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/launcher/thryve_launcher.png
    background_color: "#006D41"
    theme_color: "#006D41"
  macos:
    generate: true
    image_path: assets/icons/thryve_icon.png
  windows:
    generate: true
    image_path: assets/icons/thryve_icon.png
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/thryve_icon.png
    - docs/banks/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/Geist-Bold.ttf
          weight: 700

